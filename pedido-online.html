<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pedido Online — Chef Mind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23D4724F'/%3E%3Ctext x='50' y='62' font-size='55' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
        --primary: #D4724F;
        --primary-dark: #B85840;
        --accent: #F5A962;
        --danger: #E74C3C;
        --warning: #F39C12;
        --success: #27AE60;
        --text-dark: #2C1810;
        --text-light: #FFFFFF;
        --bg-light: #F9F7F4;
        --bg-white: #FFFFFF;
        --border: #D4A574;
        /* Era #8B7355 — contraste baixo (4.49:1 no branco, abaixo do recomendado 4.5:1 pra
           texto pequeno) e feedback real da pesquisa de teste pedia letra/cor mais legível.
           Mesma família de tom (marrom quente, combina com --primary), mas mais escuro:
           6.92:1 no branco — folga confortável acima do mínimo de acessibilidade. */
        --gray: #6B5642;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-light);
        color: var(--text-dark);
        min-height: 100vh;
    }
    header.marca {
        background: var(--bg-white);
        border-bottom: 3px solid var(--primary);
        padding: 14px 16px;
        text-align: center;
    }
    header.marca .nome { font-size: 19px; font-weight: bold; color: var(--text-dark); }
    header.marca .sub { font-size: 12px; color: var(--gray); margin-top: 2px; }
    #app {
        max-width: 460px;
        margin: 0 auto;
        padding: 16px 16px 60px;
    }
    .card {
        background: var(--bg-white);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .titulo-card { font-size: 15px; font-weight: bold; color: var(--text-dark); margin-bottom: 10px; }
    .label-secao { font-size: 14px; color: var(--gray); margin: 14px 0 8px; }
    .label-secao:first-child { margin-top: 0; }
    .dica { font-size: 13px; color: var(--gray); margin-top: 6px; }
    .dica.ok { color: var(--success); font-weight: bold; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip {
        font-size: 14px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 2px solid var(--border);
        color: var(--text-dark);
        background: var(--bg-white);
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
        user-select: none;
    }
    .chip.selecionado {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        font-weight: bold;
    }
    .chip.desabilitado {
        opacity: 0.4;
        cursor: not-allowed;
    }
    /* Seção expansível (usada em "Quer tirar algum acompanhamento?").
       Deliberadamente SEM borda de 2px e SEM negrito pesado: com aqueles, a faixa
       competia visualmente com os chips e com os campos de input, parecendo mais um
       controle a preencher. Aqui ela é só um bloco de fundo claro — lê como "seção que
       abre", não como campo. O chevron é um quadradinho fixo, alinhado ao centro
       vertical, então não fica "voando" solto ao lado do texto. */
    .secao-expansivel {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        background: var(--bg-light);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        user-select: none;
        margin-top: 20px;
    }
    .secao-expansivel .se-titulo { font-size: 14px; color: var(--text-dark); }
    .secao-expansivel .se-resumo { font-size: 13px; color: var(--gray); margin-top: 3px; }
    .secao-expansivel .se-resumo.tem-selecao { color: var(--primary); font-weight: bold; }
    .secao-expansivel .se-seta {
        flex-shrink: 0;
        width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%;
        background: var(--bg-white);
        color: var(--gray);
        font-size: 12px;
        transition: transform 0.18s ease;
    }
    .secao-expansivel.aberta .se-seta { transform: rotate(180deg); }

    .qtd-control { display:flex; align-items:center; gap:16px; }
    .qtd-btn {
        width: 40px; height: 40px;
        border-radius: 10px;
        border: 2px solid var(--border);
        background: var(--bg-white);
        font-size: 20px;
        display:flex; align-items:center; justify-content:center;
        cursor: pointer;
        color: var(--primary);
        font-weight: bold;
    }
    .qtd-valor { font-size: 18px; font-weight: bold; min-width: 20px; text-align:center; }
    input[type="text"], input[type="tel"] {
        width: 100%;
        font-size: 15px;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid var(--border);
        font-family: inherit;
        background: var(--bg-white);
        color: var(--text-dark);
    }
    input[type="text"]:focus, input[type="tel"]:focus { outline:none; border-color: var(--primary); }
    .btn {
        width: 100%;
        font-size: 16px;
        font-weight: bold;
        padding: 14px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        min-height: 48px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primario { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; }
    .btn-fantasma { background: var(--bg-white); border: 2px dashed var(--border); color: var(--gray); }
    .btn-secundario { background: var(--bg-light); border: 2px solid var(--border); color: var(--text-dark); }
    .acoes-pedido { display:flex; flex-direction:column; gap:10px; margin-top: 12px; }
    .item-carrinho {
        display:flex; justify-content:space-between; align-items:flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--bg-light);
    }
    .item-carrinho:last-child { border-bottom:none; }
    .item-nome { font-size: 14px; font-weight:bold; }
    .item-detalhe { font-size: 13px; color: var(--gray); margin-top:2px; }
    .item-preco { font-size: 13px; font-weight:bold; color: var(--primary); white-space:nowrap; margin-left:10px; }
    .item-lixeira { font-size: 18px; color: var(--danger); cursor:pointer; padding: 4px; }
    .linha-item-dir { display:flex; align-items:center; gap:10px; }
    .vazio { font-size: 13px; color: var(--gray); text-align:center; padding: 12px 4px; }
    .aviso {
        background: #FDEDEC;
        color: var(--danger);
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
    }
    .linha-total {
        display:flex; justify-content:space-between; align-items:baseline;
        border-top: 2px solid var(--bg-light);
        padding-top: 10px;
        margin-top: 6px;
    }
    .linha-total .valor { font-size: 22px; font-weight: bold; color: var(--primary); }
    .nota-retirada { font-size: 13px; color: var(--gray); margin: 12px 0 14px; display:flex; gap:6px; align-items:flex-start; }
    .campo { margin-bottom: 12px; }
    .campo label { font-size: 13px; color: var(--gray); display:block; margin-bottom:6px; }
    .tela-centro { text-align:center; }
    .icone-ok {
        width: 56px; height:56px; border-radius:50%;
        background: #E8F8EF; color: var(--success);
        font-size: 28px; display:flex; align-items:center; justify-content:center;
        margin: 0 auto 12px;
    }
    .codigo-pedido { font-size: 34px; font-weight:bold; color: var(--primary); margin: 6px 0 16px; }
    .resumo-confirmacao {
        background: var(--bg-light); border-radius: 10px; padding: 12px 14px;
        text-align:left; font-size: 13px; line-height:1.6; margin-bottom:18px;
    }
    .progresso { display:flex; align-items:center; justify-content:center; gap:6px; margin: 18px 0; }
    .etapa { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .bola { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .bola.feita { background:#E8F8EF; color: var(--success); }
    .bola.atual { background:#FEF3E2; color: var(--warning); }
    .bola.futura { background: var(--bg-light); color: var(--gray); }
    .etapa-label { font-size: 11px; color: var(--gray); }
    .etapa-label.atual { font-weight:bold; color: var(--text-dark); }
    .linha-progresso { width: 36px; height:3px; }
    .linha-progresso.feita { background: var(--success); }
    .linha-progresso.futura { background: var(--border); }
    .mensagem-status { font-size: 17px; font-weight: bold; margin-top: 4px; }
    .submensagem-status { font-size: 13px; color: var(--gray); margin-top:4px; }
    .link-discreto { font-size: 12px; color: var(--gray); text-align:center; margin-top: 18px; text-decoration: underline; cursor:pointer; }
    .ajuda-bloco {
        margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--bg-light);
    }
    .ajuda-titulo { font-size: 13px; color: var(--gray); margin-bottom: 10px; }
    .ajuda-acoes { display:flex; gap:10px; }
    .ajuda-btn {
        flex: 1;
        display:flex; align-items:center; justify-content:center; gap:8px;
        font-size: 14px; font-weight:bold;
        padding: 12px;
        border-radius: 10px;
        text-decoration:none;
        min-height: 48px;
    }
    .ajuda-btn.whatsapp { background:#E8F8EF; color:#1E8449; }
    .ajuda-btn.telefone { background:#FEF3E2; color:#B9770E; }
    .tela-fechado .icone-fechado {
        width: 56px; height:56px; border-radius:50%;
        background: #FDEDEC; color: var(--danger);
        font-size: 26px; display:flex; align-items:center; justify-content:center;
        margin: 0 auto 12px;
    }
    .horario-funcionamento { font-size: 14px; color: var(--text-dark); margin: 10px 0 4px; font-weight:bold; }
    .loading-spinner {
        text-align:center; padding: 40px 16px; color: var(--gray); font-size: 14px;
    }
    /* Snackbar — fixo no rodapé, visível em qualquer posição de scroll */
    #snackbar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(16px);
        background: var(--danger);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: bold;
        max-width: 340px;
        width: calc(100% - 40px);
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 9999;
        pointer-events: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    #snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* +/- mini no carrinho — padrão iFood */
    .qtd-mini { display:flex; align-items:center; gap:6px; }
    .qtd-mini-btn {
        width: 30px; height: 30px;
        border-radius: 6px;
        border: 2px solid var(--border);
        background: var(--bg-white);
        display:flex; align-items:center; justify-content:center;
        font-size: 18px; font-weight:bold; color: var(--primary);
        cursor: pointer; user-select:none;
    }
    .qtd-mini-btn:active { background: var(--bg-light); }
    .qtd-mini-val { font-size: 14px; font-weight:bold; min-width: 18px; text-align:center; }
    /* Loading de envio — tela amigável enquanto o POST processa */
    .tela-enviando { padding: 40px 16px; }
    .enviando-icone { font-size: 56px; display:block; margin-bottom:16px;
        animation: balanco 0.9s ease-in-out infinite alternate; }
    @keyframes balanco {
        from { transform: rotate(-8deg) scale(1); }
        to   { transform: rotate(8deg) scale(1.08); }
    }
    .enviando-dots { display:flex; justify-content:center; gap:10px; margin-top:22px; }
    .enviando-dots span {
        width:10px; height:10px; border-radius:50%;
        background: var(--primary);
        animation: piscar 1.1s ease infinite;
    }
    .enviando-dots span:nth-child(2) { animation-delay: 0.18s; }
    .enviando-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes piscar {
        0%,80%,100% { transform:scale(0.55); opacity:0.35; }
        40%          { transform:scale(1.1);  opacity:1;    }
    }
</style>
</head>
<body>
<header class="marca">
    <div class="nome">🍽️ Michelin Restaurante</div>
    <div class="sub">Pedido online · Retire e pague no caixa</div>
</header>
<div id="app"><div class="loading-spinner">Carregando opções do dia...</div></div>
<div id="snackbar"></div>

<script>
// ===== Config do backend (mesma URL usada pelo app principal) =====
const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbwAaSxDyP5NC8HlJ9AgMVWOV0CzjFfbr1DLNwSIp3BgEymvHGaYb2VLz5gY58dgOTg98w/exec';

// ===== Chaves de localStorage =====
// Sessão ativa: comanda em andamento neste aparelho (recuperação ao fechar/reabrir o navegador)
const CHAVE_SESSAO = 'chefMind_pedidoOnline_sessao';
// Dados do cliente: nome/whatsapp lembrados SEM expiração, pra pré-popular o form na próxima visita
const CHAVE_CLIENTE = 'chefMind_pedidoOnline_cliente';

// ── MARCA DE VERSÃO ───────────────────────────────────────────────────────────
// ATUALIZAR a cada pacote que for pra produção (data + letra sequencial no dia).
// Mesmo motivo do index.html: GitHub Pages e navegador servem cópia em cache por um
// tempo, e sem isso não dá pra saber qual versão está de fato rodando no aparelho —
// só deduzir por sintoma, que já nos custou horas. O estado da trava de horário
// aparece junto de propósito: é a diferença mais fácil de confundir entre versões.
const CHEF_MIND_PEDIDO_VERSAO = '2026-08-29-a';

// Horário de atendimento p/ pedido online — validação client-side (mesma janela usada
// na operação física). Não há enforcement server-side ainda; combinou-se manter o fluxo
// igual ao protótipo validado e revisitar isso só se houver pedido fora de horário na prática.
const HORARIO_ABERTURA_MIN = 10 * 60 + 30;   // 10:30 (trava real — exibição permanece 11h)
const HORARIO_FECHAMENTO_MIN = 14 * 60 + 30; // 14:30
const WHATSAPP_AJUDA = '5541997829474';      // 41 99782-9474, com DDI 55
const TELEFONE_AJUDA = '+5541997829474';

// MODO TESTE (usado jul/2026 pra testar/ajustar o pedido online fora do horário real
// de atendimento) — com true, ignora a janela de horário e a tela "fora do horário"
// nunca aparece. Revertido pra false antes do go-live: a partir daqui a regra de
// horário de abertura/fechamento volta a valer normalmente pros clientes reais.
// MODO TESTE — com true, ignora a janela de horário e a tela "fora do horário" nunca
// aparece. Usado pontualmente para validar mudanças fora do expediente; sempre reverter
// para false antes de publicar, senão o pedido online fica aberto 24h e um cliente
// consegue fazer pedido de madrugada. Estado atual: DESLIGADO (trava valendo normal).
// 🔓 Trava de horário liberada APENAS por `?teste=1` na URL.
//
// Antes era um `false` fixo que precisava virar `true` para testar — e enquanto estivesse
// `true`, QUALQUER cliente com o link (que já está distribuído) conseguiria fazer pedido
// fora do horário, com a cozinha fechada. Um "esqueci de reverter" custaria pedido real
// que ninguém prepara.
//
// Com o parâmetro, o link normal continua com a trava ativa para o cliente, e o teste
// não depende de ninguém lembrar de desfazer nada.
const _TESTE_IGNORAR_HORARIO = new URLSearchParams(location.search).get('teste') === '1';

console.log(
    '%c Pedido Online ' + CHEF_MIND_PEDIDO_VERSAO + ' ',
    'background:#D4724F;color:#fff;font-weight:bold;padding:3px 8px;border-radius:3px;font-size:12px;'
);
console.log('[Pedido Online] Trava de horário:', _TESTE_IGNORAR_HORARIO ? '🔓 IGNORADA (modo teste)' : '🔒 ativa');

function estaDentroDoHorario() {
    if (_TESTE_IGNORAR_HORARIO) return true;
    const agora = new Date();
    const minutos = agora.getHours() * 60 + agora.getMinutes();
    return minutos >= HORARIO_ABERTURA_MIN && minutos <= HORARIO_FECHAMENTO_MIN;
}

// ===== Chamadas à API =====
// Regra 9: GETs usam AbortController com timeout de 20s.
// cache: 'no-store' evita que o browser sirva resposta cacheada no polling de status.
async function apiGet(action, params, timeoutMs) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs || 20000);
    const qs = new URLSearchParams(Object.assign({ action, _t: Date.now() }, params || {})).toString();
    try {
        const resp = await fetch(`${SHEETS_API_URL}?${qs}`, { signal: controller.signal, cache: 'no-store' });
        return await resp.json();
    } finally {
        clearTimeout(timeoutId);
    }
}

// Regra 2: POST NUNCA usa AbortController/signal — o GAS responde via redirect HTTP 302
// e o signal cancelaria a requisição no meio do redirect, perdendo a escrita silenciosamente.
// ═══════════════════════════════════════════════════════════════════════════════════
// ITEM B — o POST não tinha prazo, e a tela do cliente travava para sempre
// ═══════════════════════════════════════════════════════════════════════════════════
//
// Reproduzido em 05/08: pedido feito dentro do horário, GRAVADO corretamente na
// planilha, e a mensagem "estamos gerando seu pedido" ficou na tela para sempre.
// Refresh → voltou para o formulário vazio.
//
// Aqui o custo é maior que no index.html. O cliente não sabe que o pedido entrou, não
// consegue acompanhar, e a reação natural dele é PEDIR DE NOVO. A cozinha prepara os
// dois e alguém paga por isso.
//
// Não podemos passar `signal` (Regra 2 — cancela o redirect 302 do GAS e aí sim o
// pedido não é gravado). `Promise.race` resolve sem tocar no fetch: ele continua vivo
// e grava normalmente; só paramos de prender a tela nele.
const _POST_PRAZO_MS = 30000;

// "Não sei" é um terceiro estado, ao lado de "deu certo" e "deu errado" — e é o mais
// perigoso de traduzir errado. Dizer "falhou" para um pedido que foi gravado é
// literalmente instruir o cliente a duplicar.
function _respostaIncerta(r) { return !!r && r._incerto === true; }

// ── ONDA 1 no pedido online ──
//
// A chave é gerada UMA vez e persiste até o pedido entrar. É isso que torna o reenvio
// inofensivo: o servidor reconhece a repetição e devolve o mesmo pedido em vez de criar
// um segundo. Sem ela, "tentar de novo" era exatamente o que produzia a duplicata que a
// cozinha preparava.
//
// Persistir importa mais aqui do que no app do operador: o cliente fecha a aba, o celular
// mata a página em segundo plano, ele reabre o link. Se a chave morresse junto com a
// sessão, o reenvio voltaria a ser um pedido novo.
const CHAVE_CLIENTE_KEY = 'chefmind-pedido-clientekey';

// Payload do último envio que ficou sem confirmação, guardado para o botão "Verificar meu
// pedido". Declarado aqui, junto do resto da Onda 1, e não lá embaixo perto de quem o usa:
// em 06/08 um bloco enxertado acima da declaração de um `let` derrubou o ciclo do poll por
// zona morta temporal, e o erro só aparecia no caminho raro (ver Seção 7 do Knowledge).
let _payloadIncerto = null;

// ═══════════════════════════════════════════════════════════════════════════════
// PEDIDO EM VOO — gravado ANTES do envio (ponto 25-C, 27/08)
// ═══════════════════════════════════════════════════════════════════════════════
//
// O defeito: `salvarSessaoAtiva` só rodava DEPOIS da resposta. Com a cauda de transporte, a
// espera chega a 30s — e se o cliente recarrega a página nesse intervalo, ele volta ao
// cardápio como se nada tivesse acontecido. O pedido está gravado na planilha, a cozinha vai
// preparar, e o cliente não vê nada. O caminho natural dele é **pedir de novo**.
//
// É a mesma lição do ponto 23 do lado do operador: a INTENÇÃO precisa estar no localStorage
// antes de qualquer espera. Aqui vai o payload inteiro, porque reenviar é seguro — o servidor
// deduplica pela `cliente_key` e devolve o pedido existente em vez de criar outro.
//
// Observado duas vezes pelo Bruno em poucos testes. Como quem sofre é o cliente, que fecha a
// aba e vai embora, isso jamais apareceria em log nenhum.
const CHAVE_PEDIDO_EM_VOO = 'chefmind-pedido-em-voo';
const _EM_VOO_VALIDADE_MS = 30 * 60 * 1000;   // meia hora: além disso o pedido não é mais "de agora"

function _marcarPedidoEmVoo(payload) {
    // ⚠️ GRAVA EM DOIS LUGARES, de propósito.
    //
    // Em 28/08 o Bruno provou que a marca não sobrevive ao F5: o `getItem` logo depois do
    // recarregamento devolve `null`, mesmo com a gravação tendo sido confirmada por leitura
    // de volta um instante antes. Ou seja, "o setItem não lançou" e até "o getItem seguinte
    // devolveu o valor" NÃO garantem que o dado atravessou o recarregamento — o localStorage
    // do Chrome confirma na cópia em memória e persiste de forma assíncrona, e a página
    // morrendo no meio disso pode levar a gravação junto.
    //
    // O `sessionStorage` é um armazenamento SEPARADO, com outro caminho de persistência, e
    // sobrevive a F5 na mesma aba — que é exatamente o caso aqui. Duas gravações
    // independentes: para perder o pedido agora, as DUAS têm que falhar no mesmo instante.
    //
    // Não é redundância por precaução vaga. É a resposta direta a um dado observado.
    const registro = JSON.stringify({ payload: payload, ts: Date.now() });
    let ondeGravou = [];

    try { localStorage.setItem(CHAVE_PEDIDO_EM_VOO, registro); ondeGravou.push('local'); }
    catch (e) { console.warn('[EmVoo] localStorage recusou:', e.message); }

    try { sessionStorage.setItem(CHAVE_PEDIDO_EM_VOO, registro); ondeGravou.push('session'); }
    catch (e) { console.warn('[EmVoo] sessionStorage recusou:', e.message); }

    if (!ondeGravou.length) {
        console.error('%c[Pedido] 🔴 NENHUM armazenamento aceitou a marca — o F5 vai perder o pedido',
                      'color:red;font-weight:bold');
        return;
    }
    console.log('%c[Pedido] 📌 marcado EM VOO em: ' + ondeGravou.join(' + ') +
                ' (' + registro.length + ' chars)', 'color:#E67E22;font-weight:bold');
}

function _lerPedidoEmVoo() {
    // Diz POR QUE devolveu nada, e — quando devolve algo — de QUAL armazenamento veio.
    // Essa segunda informação é o experimento embutido: se a marca vier sempre do
    // `sessionStorage`, o localStorage é que está perdendo a gravação no F5, e isso fica
    // provado em produção sem precisar de mais nenhuma rodada de teste.
    const fontes = [
        { nome: 'localStorage',   ler: () => localStorage.getItem(CHAVE_PEDIDO_EM_VOO) },
        { nome: 'sessionStorage', ler: () => sessionStorage.getItem(CHAVE_PEDIDO_EM_VOO) }
    ];

    let bruto = null, origem = null, faltou = [];
    for (const f of fontes) {
        let v = null;
        try { v = f.ler(); } catch (e) { console.warn('[EmVoo] ' + f.nome + ' inacessível:', e.message); continue; }
        if (v) { if (!bruto) { bruto = v; origem = f.nome; } }
        else faltou.push(f.nome);
    }

    if (!bruto) { console.log('[EmVoo] nada gravado em nenhum armazenamento'); return null; }
    if (faltou.length) {
        console.warn('%c[EmVoo] ⚠️ a marca sobreviveu em ' + origem + ', mas SUMIU de ' +
                     faltou.join(' e ') + ' — foi a segunda gravação que salvou o pedido',
                     'color:#E67E22;font-weight:bold');
    }

    let v = null;
    try { v = JSON.parse(bruto); }
    catch (e) { console.warn('[EmVoo] conteúdo ilegível — descartando:', bruto.slice(0, 80)); _limparPedidoEmVoo(); return null; }

    if (!v || !v.payload) { console.warn('[EmVoo] gravado sem payload:', v); return null; }

    const idade = Date.now() - (v.ts || 0);
    if (idade > _EM_VOO_VALIDADE_MS) {
        console.warn('[EmVoo] expirado (' + Math.round(idade / 1000) + 's) — descartando');
        _limparPedidoEmVoo();
        return null;
    }
    console.log('[EmVoo] ✅ encontrado em ' + origem + ', gravado há ' + Math.round(idade / 1000) + 's');
    return v.payload;
}

function _limparPedidoEmVoo() {
    // Limpa os DOIS. Deixar um para trás faria a próxima abertura tentar recuperar um pedido
    // já resolvido — o defeito inverso, e igualmente confuso para o cliente.
    let tinha = false;
    try { if (localStorage.getItem(CHAVE_PEDIDO_EM_VOO)) tinha = true; localStorage.removeItem(CHAVE_PEDIDO_EM_VOO); } catch (e) {}
    try { if (sessionStorage.getItem(CHAVE_PEDIDO_EM_VOO)) tinha = true; sessionStorage.removeItem(CHAVE_PEDIDO_EM_VOO); } catch (e) {}
    if (tinha) console.log('%c[Pedido] ✅ marca EM VOO liberada (pedido resolvido)', 'color:green');
}

// Atalho de teste: zera tudo do Pedido Online e volta para a URL limpa, sem `?novo=1`.
// Existe porque, depois do primeiro pedido, a sessão salva manda o cliente direto para o
// acompanhamento — e a única forma de voltar ao formulário era pelo `?novo=1`, que é
// justamente o parâmetro sob teste.
window.cmResetPedido = function () {
    localStorage.removeItem(CHAVE_SESSAO);
    localStorage.removeItem(CHAVE_CLIENTE_KEY);
    try { sessionStorage.removeItem(CHAVE_PEDIDO_EM_VOO); } catch (e) {}
    localStorage.removeItem(CHAVE_PEDIDO_EM_VOO);
    console.log('[Pedido] estado zerado — recarregando na URL limpa');
    // ⚠️ URL ABSOLUTA, não `location.pathname`.
    //
    // Em `file://` cada arquivo é uma "unique security origin", e navegar para um caminho
    // RELATIVO dispara `Unsafe attempt to load URL ... from frame with URL ...` — o Chrome
    // bloqueia, e a página fica num meio-termo. Foi o que deixou o teste do Bruno
    // intermitente em 28/08: o reset às vezes acontecia, às vezes não, e a diferença
    // aparecia lá na frente como "caiu no cardápio".
    location.href = location.href.split('?')[0].split('#')[0];
};

function _obterClienteKey() {
    let k = localStorage.getItem(CHAVE_CLIENTE_KEY);
    if (!k) {
        k = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
        localStorage.setItem(CHAVE_CLIENTE_KEY, k);
    }
    return k;
}

function _limparClienteKey() {
    localStorage.removeItem(CHAVE_CLIENTE_KEY);
}

async function apiPost(action, payload) {
    // O `.catch` evita unhandledrejection: quando o prazo vence, esta promise segue
    // pendente e pode rejeitar depois (queda de rede) sem ninguém escutando.
    const _emVoo = fetch(SHEETS_API_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ action }, payload))
    })
        .then(r => r.json())
        .catch(err => ({ erro: err.message }));

    const _prazo = new Promise(resolve => setTimeout(() => resolve({
        erro: `Sem confirmação do servidor em ${_POST_PRAZO_MS / 1000}s`,
        _incerto: true
    }), _POST_PRAZO_MS));

    return Promise.race([_emVoo, _prazo]);
}

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function lerClienteSalvo() {
    try { return JSON.parse(localStorage.getItem(CHAVE_CLIENTE) || 'null') || { nome: '', whatsapp: '' }; }
    catch (e) { return { nome: '', whatsapp: '' }; }
}

function salvarClienteLembrado(nome, whatsapp) {
    localStorage.setItem(CHAVE_CLIENTE, JSON.stringify({ nome, whatsapp }));
}

function lerSessaoAtiva() {
    try {
        const s = JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null');
        if (!s) return null;
        // Sessão sem _ts foi salva antes do fix de expiração — descartar
        // Sessão com mais de 12 horas também é descartada
        const DOZE_HORAS = 12 * 60 * 60 * 1000;
        if (!s._ts || (Date.now() - s._ts) > DOZE_HORAS) {
            localStorage.removeItem(CHAVE_SESSAO);
            return null;
        }
        return s;
    }
    catch (e) { return null; }
}

function salvarSessaoAtiva(dados) {
    localStorage.setItem(CHAVE_SESSAO, JSON.stringify({ ...dados, _ts: Date.now() }));
}

function limparSessaoAtiva() {

}

// ===== Estado em memória =====
// TAMANHOS é montado a partir do cardápio real (cada marmita "Marmita P/M/G" vira uma
// opção de tamanho). maxCarnes (quantas carnes por tamanho) não existe como campo no
// cardápio — é uma regra de UX fixa replicada do protótipo já validado com o usuário
// (P = 1 carne, M/G = 2 carnes), não uma config de backend.
const MAX_CARNES_POR_LETRA = { P: 1, M: 2, G: 2 };

let TAMANHOS = {};      // { P: {label, preco, codigo, maxCarnes}, ... }
let CARNES_DO_DIA = [];
let BEBIDAS_CARDAPIO = []; // [{codigo, nome, preco}]

let state = {
    tamanho: null,
    carnesSelecionadas: [],
    qtd: 1,
    obs: '',
    carrinho: [],
    bebidaAberta: false,
    bebidas: [],
    nome: '',
    whatsapp: '',
    erro: '',
    obsAberta: false,
    acompAberto: false, // seção "Quer tirar algum acompanhamento?" expandida (ver blocoAcompanhamentos)
    rolarParaPedidoAoRenderizar: false,
    rolarParaConfiguradorAoRenderizar: false,
    enviando: false,
    // null = configurando marmita nova; número = editando o item desse índice no carrinho
    // (ver editarItemCarrinho/adicionarAoPedido/cancelarEdicaoItem). Nada é removido do
    // carrinho até a edição ser de fato confirmada — ver nota no editarItemCarrinho.
    editandoIndex: null
};

let view = 'carregando';
let intervaloPolling = null;
let pedidoAtual = null; // { comandaId, numero, nome, itens, bebidas, total } — sessão ativa em memória

let _snackbarTimer = null;
function _mostrarSnackbar(msg, cor) {
    const el = document.getElementById('snackbar');
    if (!el) return;
    el.textContent = msg;
    el.style.background = cor;
    el.classList.add('show');
    clearTimeout(_snackbarTimer);
    _snackbarTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function erro(msg) { _mostrarSnackbar(msg, 'var(--danger)'); }

// Confirmação visual ao adicionar uma marmita ao pedido (pesquisa de teste: sem isso, não
// ficava claro que a marmita anterior já tinha sido "fechada" e que o formulário abaixo era
// uma configuração nova, do zero — parte da mesma confusão do ajuste em "Quantidade").
function sucesso(msg) { _mostrarSnackbar(msg, 'var(--success)'); }

function mascararWhatsapp(valor) {
    const d = valor.replace(/\D/g, '').slice(0, 11);
    if (d.length === 0) return '';
    if (d.length <= 2) return `(${d}`;
    if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
    return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

function aoDigitarWhatsapp(valorDigitado) {
    state.whatsapp = mascararWhatsapp(valorDigitado);
    const campo = document.getElementById('campoWhatsapp');
    if (campo) campo.value = state.whatsapp;
}

function selecionarTamanho(t) {
    state.tamanho = t;
    const max = TAMANHOS[t].maxCarnes;
    if (state.carnesSelecionadas.length > max) {
        state.carnesSelecionadas = state.carnesSelecionadas.slice(0, max);
    }
    render();
}

function toggleCarne(nome) {
    if (!state.tamanho) { erro('Escolha o tamanho primeiro'); return; }
    const max = TAMANHOS[state.tamanho].maxCarnes;
    const idx = state.carnesSelecionadas.indexOf(nome);
    if (idx >= 0) {
        state.carnesSelecionadas.splice(idx, 1);
    } else if (max === 1) {
        state.carnesSelecionadas = [nome];
    } else if (state.carnesSelecionadas.length >= max) {
        erro(`Máximo de ${max} carnes para esse tamanho`);
        return;
    } else {
        state.carnesSelecionadas.push(nome);
    }
    render();
}

function alterarQtd(delta) {
    state.qtd = Math.max(1, state.qtd + delta);
    render();
}

// Um chip por acompanhamento da marmita, na mesma ordem em que aparecem no texto
// descritivo do topo. Todos começam com "Sem": a própria gramática limita o que o
// cliente pode pedir — dá pra RETIRAR um acompanhamento, nunca pedir a mais, trocar
// ou inventar. Antes o único caminho era um campo de texto livre escondido atrás de um
// link discreto, que praticamente ninguém percebia: quem queria tirar feijão não avisava,
// a marmita saía errada e era refeita (prejuízo + demora pro cliente).
// ATENÇÃO: manter estes textos IDÊNTICOS a MARNITA_OBS_SUGESTOES do index.html — os dois
// fluxos gravam na mesma coluna `observacao` e caem na mesma fila do Preparo.
const OBS_SUGESTOES = ['Sem Arroz', 'Sem Feijão', 'Sem Macarrão', 'Sem Farofa', 'Sem Legumes', 'Sem Fritura', 'Sem Salada'];

// Mesma mecânica dos chips do operador (_marnitaToggleObsSugestao no index.html):
// os chips e o campo de texto escrevem no MESMO state.obs, separados por vírgula.
// Assim o que o cliente digita e o que ele toca convivem sem campo duplicado.
function toggleObsSugestao(texto) {
    const partes = String(state.obs || '').split(',').map(s => s.trim()).filter(Boolean);
    const idx = partes.findIndex(p => p.toLowerCase() === texto.toLowerCase());
    if (idx >= 0) partes.splice(idx, 1);
    else partes.push(texto);
    state.obs = partes.join(', ');
    render();
}

function toggleAcompAberto() {
    state.acompAberto = !state.acompAberto;
    render();
}

function toggleObsAberta() {
    state.obsAberta = !state.obsAberta;
    render();
}

function adicionarAoPedido() {
    if (!state.tamanho) { erro('Escolha o tamanho da marmita'); return; }
    if (state.carnesSelecionadas.length === 0) { erro('Escolha pelo menos 1 carne'); return; }
    const _tamanhoAdicionado = state.tamanho;
    const _qtdAdicionada     = state.qtd;
    const _estavaEditando    = state.editandoIndex !== null;
    const novoItem = {
        tamanho: state.tamanho,
        codigo: TAMANHOS[state.tamanho].codigo,
        carnes: [...state.carnesSelecionadas],
        qtd: state.qtd,
        obs: state.obs.trim(),
        precoUnit: TAMANHOS[state.tamanho].preco
    };
    // Editando um item existente (ver editarItemCarrinho): substitui no lugar em vez de
    // criar uma linha nova — o item original só é de fato alterado agora, na confirmação.
    if (_estavaEditando) {
        state.carrinho[state.editandoIndex] = novoItem;
        state.editandoIndex = null;
    } else {
        state.carrinho.push(novoItem);
    }
    state.tamanho = null;
    state.carnesSelecionadas = [];
    state.qtd = 1;
    state.obs = '';
    state.obsAberta = false;
    state.rolarParaPedidoAoRenderizar = true;
    render();
    sucesso(_estavaEditando
        ? '✅ Alterações salvas!'
        : `✅ Marmita ${_tamanhoAdicionado}${_qtdAdicionada > 1 ? ' (' + _qtdAdicionada + 'x)' : ''} adicionada!`);
}

function removerDoCarrinho(i) {
    state.carrinho.splice(i, 1);
    render();
}

// Reabre o configurador pré-preenchido com os valores desse item (tamanho, carnes,
// quantidade, observação) SEM removê-lo do carrinho ainda — só marca `editandoIndex`.
// A substituição de fato só acontece se/quando "+ Adicionar ao pedido" for clicado de novo
// (ver adicionarAoPedido). Antes, um único toque já removia o item na hora — um toque
// acidental (comum em celular, usuário com pressa) apagava o pedido sem confirmação
// nenhuma; agora nada é perdido até a edição ser confirmada, e cancelarEdicaoItem() permite
// desistir sem alterar nada.
function editarItemCarrinho(i) {
    const item = state.carrinho[i];
    if (!item) return;
    state.editandoIndex = i;
    state.tamanho = item.tamanho;
    state.carnesSelecionadas = [...item.carnes];
    state.qtd = item.qtd;
    state.obs = item.obs || '';
    state.obsAberta = !!item.obs;
    state.rolarParaConfiguradorAoRenderizar = true;
    render();
}

// Desiste da edição em andamento sem alterar o item original no carrinho.
function cancelarEdicaoItem() {
    state.editandoIndex = null;
    state.tamanho = null;
    state.carnesSelecionadas = [];
    state.qtd = 1;
    state.obs = '';
    state.obsAberta = false;
    render();
}

function irParaConfigurador() {
    // Se havia uma edição em andamento (ver editarItemCarrinho) e o usuário clicou em
    // "+ Adicionar outra marmita" em vez de salvar/cancelar, entende-se que ele quer uma
    // marmita NOVA — cancela a edição pendente (o item original no carrinho já está intacto,
    // nada muda nele) pra não correr o risco de sobrescrevê-lo sem querer no próximo "salvar".
    if (state.editandoIndex !== null) cancelarEdicaoItem();
    state.rolarParaConfiguradorAoRenderizar = true;
    render();
}

function toggleBebidaAberta() {
    state.bebidaAberta = !state.bebidaAberta;
    render();
}

function adicionarBebida(codigo, nome, preco) {
    const existente = state.bebidas.find(b => b.codigo === codigo);
    if (existente) existente.qtd++;
    else state.bebidas.push({ codigo, nome, preco, qtd: 1 });
    // Confirmação imediata: a lista do pedido fica ACIMA das opções de bebida, então
    // sem isso o cliente toca e não vê nada acontecer sem rolar a tela de volta.
    const _q = existente ? existente.qtd : 1;
    sucesso(`✅ ${nome}${_q > 1 ? ` (${_q}×)` : ''} adicionada!`);
    render();
}

function removerBebida(codigo) {
    state.bebidas = state.bebidas.filter(b => b.codigo !== codigo);
    render();
}

function alterarQtdCarrinho(i, delta) {
    const novaQtd = state.carrinho[i].qtd + delta;
    if (novaQtd <= 0) state.carrinho.splice(i, 1);
    else state.carrinho[i].qtd = novaQtd;
    render();
}

function alterarQtdBebida(codigo, delta) {
    const b = state.bebidas.find(x => x.codigo === codigo);
    if (!b) return;
    b.qtd += delta;
    if (b.qtd <= 0) state.bebidas = state.bebidas.filter(x => x.codigo !== codigo);
    render();
}

function calcularTotal() {
    const totalMarmitas = state.carrinho.reduce((s, i) => s + i.qtd * i.precoUnit, 0);
    const totalBebidas = state.bebidas.reduce((s, b) => s + b.qtd * b.preco, 0);
    return totalMarmitas + totalBebidas;
}

async function confirmarPedido() {
    if (!estaDentroDoHorario()) { view = 'fechado'; render(); return; }
    if (state.carrinho.length === 0 && state.bebidas.length === 0) { erro('Adicione pelo menos um item ao pedido'); return; }
    if (!state.nome.trim()) { erro('Informe seu nome'); return; }
    const digitosWhatsapp = state.whatsapp.replace(/\D/g, '');
    if (digitosWhatsapp.length < 10) { erro('Informe um WhatsApp válido com DDD'); return; }

    state.enviando = true;
    render();

    const payload = {
        nomeCliente: state.nome.trim(),
        whatsapp: digitosWhatsapp,
        itens: state.carrinho.map(item => ({
            codigo: item.codigo,
            quantidade: item.qtd,
            carne: item.carnes.join(' + '),
            obs: item.obs
        })),
        bebidas: state.bebidas.map(b => ({ codigo: b.codigo, quantidade: b.qtd })),
        cliente_key: _obterClienteKey()
    };

    // ⚠️ ANTES DA ESPERA, não depois. Ver a nota em CHAVE_PEDIDO_EM_VOO.
    _marcarPedidoEmVoo(payload);

    let resultado;
    try {
        // Sem signal (Regra 2) — mesmo que o cliente feche a aba logo depois, o POST
        // já foi disparado e a comanda é criada no Sheets independente da resposta.
        resultado = await apiPost('novoPedidoOnline', payload);
    } catch (e) {
        state.enviando = false;
        erro('Não foi possível enviar o pedido. Verifique sua internet e tente de novo.');
        return;
    }

    state.enviando = false;

    // ⏱️ SEM CONFIRMAÇÃO — o desfecho mais provável é que o pedido TENHA entrado.
    //
    // Este ramo tem que vir ANTES do teste de erro abaixo, porque a resposta incerta
    // também carrega `.erro` — e cair no snackbar vermelho "Erro ao enviar o pedido.
    // Tente de novo." seria exatamente a instrução que produz o pedido duplicado.
    //
    // Também não pode ser um snackbar: ele some sozinho e o cliente fica olhando o
    // formulário preenchido, que é um convite a apertar Enviar de novo. Precisa ser uma
    // tela que substitui o formulário e tira essa opção da frente dele.
    if (_respostaIncerta(resultado)) {
        console.warn('[Pedido] Envio sem confirmação — provável gravação em voo');
        salvarClienteLembrado(state.nome.trim(), state.whatsapp.trim());
        _payloadIncerto = payload;   // guardado para o botão "Verificar meu pedido"
        view = 'envio_incerto';
        render();
        return;
    }

    if (!resultado || resultado.erro) {
        // Recusa CONCLUSIVA do servidor: o pedido não entrou, então não há o que recuperar
        // depois. Manter a marca faria a próxima abertura da página tentar reenviar algo que
        // o servidor já rejeitou.
        _limparPedidoEmVoo();
        erro((resultado && resultado.erro) || 'Erro ao enviar o pedido. Tente de novo.');
        return;
    }

    // ⚠️ A ORDEM AQUI É O DEFEITO QUE O BRUNO ACHOU EM 28/08 — e ela é o ponto todo.
    //
    // Antes: limpava a marca de "em voo" PRIMEIRO e salvava a sessão DEPOIS. Entre as duas
    // linhas existia uma janela de milissegundos em que **nenhuma das duas âncoras existia**.
    //
    // Parece impossível de acertar, mas o cenário do teste cai nela sistematicamente: o
    // cliente dá F5 enquanto a tela diz "Enviando"; a resposta chega DURANTE o
    // recarregamento; o código da página velha ainda roda o suficiente para limpar a marca;
    // e a página morre antes de salvar a sessão. As duas somem, e o pedido fica invisível —
    // exatamente o desfecho que este ponto existe para impedir.
    //
    // Com a resposta represada em 35s isso nunca acontecia, porque a resposta não chegava
    // antes do F5. Foi por isso que o teste passava com o patch e falhava sem ele.
    //
    // A regra, que vale além daqui: **nunca destrua a âncora antiga antes de a nova existir.**
    // Salvar a sessão primeiro é seguro em qualquer ordem de morte da página — no pior caso
    // sobram as duas, e ter as duas nunca fez mal a ninguém.
    salvarClienteLembrado(state.nome.trim(), state.whatsapp.trim());

    pedidoAtual = {
        comandaId: resultado.comandaId,
        numero: resultado.numero,
        nome: state.nome.trim(),
        itens: state.carrinho,
        bebidas: state.bebidas,
        total: calcularTotal()
    };
    salvarSessaoAtiva(pedidoAtual);   // 1º: a nova âncora passa a existir

    _limparPedidoEmVoo();             // 2º: só então a antiga pode ir
    _limparMarcaNovoNaURL();
    _limparClienteKey();

    view = 'confirmacao';
    render();
}

function irParaStatus() {
    view = 'status';
    render();
    iniciarPolling();
}

function novoPedido() {
    limparSessaoAtiva();
    pararPolling();
    pedidoAtual = null;
    const clienteSalvo = lerClienteSalvo();
    state = {
        tamanho: null, carnesSelecionadas: [], qtd: 1, obs: '', carrinho: [],
        bebidaAberta: false, bebidas: [],
        nome: clienteSalvo.nome || '', whatsapp: clienteSalvo.whatsapp || '',
        erro: '', obsAberta: false, acompAberto: false,
        rolarParaPedidoAoRenderizar: false, rolarParaConfiguradorAoRenderizar: false,
        enviando: false, editandoIndex: null
    };
    view = estaDentroDoHorario() ? 'form' : 'fechado';
    render();
}

// Abre o formulário de novo pedido numa aba nova, deixando a aba atual intacta —
// assim o cliente não perde o acompanhamento do pedido que já está em andamento
// (decisão do usuário: "abrir nova aba" em vez de avisar/perder a sessão atual).
// Usa location.pathname (sem query string) pra garantir que a nova aba carrega
// limpa, sem nenhum parâmetro que possa interferir na leitura da sessão dela.
function novoPedidoEmNovaAba() {
    // ?novo=1 sinaliza pra essa nova aba ignorar a sessão ativa do localStorage (que é
    // compartilhada entre abas da mesma origem) e abrir direto no formulário — sem isso
    // a nova aba reconheceria a mesma sessão e cairia de volta na tela de acompanhamento.
    // URL ABSOLUTA — `location.pathname` é caminho relativo, e em `file://` cada arquivo é
    // uma origem única: abrir relativo dispara "Unsafe attempt to load URL" e o Chrome
    // bloqueia. Em produção (https) funciona, mas o teste local não — e foi isso que
    // impediu o cenário do `?novo=1` de ser testado em 28/08. Mesma causa do
    // `cmResetPedido`, no mesmo dia: caminho relativo em file:// não é confiável.
    window.open(location.href.split('?')[0].split('#')[0] + '?novo=1', '_blank');
}

// ===== Polling do status (ponto 10 do plano emergencial) =====
//
// Era 3s. O intervalo veio do QA original ("refletir em até ~3s"), pensado quando
// isto era protótipo — mas cada cliente com pedido aberto é mais um aparelho
// martelando o servidor, DE FORA do restaurante. Dez clientes esperando ao meio-dia
// era mais carga que todos os aparelhos internos somados, e o pior: escala com o
// sucesso do canal. Quanto melhor o pedido online funciona, mais ele se afoga.
//
// 15s não muda nada para o cliente (ele está esperando comida, não uma cotação de
// bolsa) e corta a carga do canal em 5×.
// 15s → 30s (etapa 5 do ponto 3b, aprovado em 05/08 e aplicado em 13/08).
//
// O cliente acompanha o pedido dele em minutos, não em segundos: o preparo de uma marmita
// leva vários minutos, e a diferença entre saber do "Pronto" em 15s ou em 30s não muda nada
// para ele. Do lado do servidor a diferença é o dobro — e este é o único poll que escala com
// o número de CLIENTES, não com o número de aparelhos do restaurante.
//
// O piso do gatilho por visibilidade acompanha automaticamente (Regra 48), então um cliente
// alternando entre apps continua sem conseguir gerar mais chamadas que o poll normal.
const _POLL_INTERVALO_MS = 30000;

// Piso entre duas consultas, para o gatilho de visibilidade abaixo. Sem ele, um
// cliente alternando entre apps dispararia uma chamada a cada troca — trocaríamos
// um problema de carga por outro.
//
// É IGUAL ao intervalo do poll, e não um número menor solto, porque a pergunta
// certa não é "faz quanto tempo da última chamada?" e sim "o dado que já tenho
// está velho?". Se o cliente voltou 6s depois, o status na tela tem 6s de idade —
// está fresco, buscar de novo não acrescenta nada. Só vale reconsultar quando a
// aba ficou oculta tempo suficiente para o dado envelhecer.
//
// Efeito colateral bom: por construção, NENHUMA sequência de alternâncias consegue
// gerar mais chamadas que o poll normal. Com um piso menor (tentei 5s antes), um
// cliente trocando de app a cada 6s geraria 10 chamadas/min contra as 4/min do
// poll — o gatilho viraria a fonte de carga que ele deveria evitar.
const _POLL_MIN_ENTRE_CHAMADAS_MS = _POLL_INTERVALO_MS;

let _ultimaConsulta = 0;
let _pollEncerrado  = false;   // pedido pronto/concluído: acabou o que consultar

function iniciarPolling() {
    pararPolling();
    _pollEncerrado = false;    // pedido novo reabre o ciclo
    consultarStatus();
    intervaloPolling = setInterval(consultarStatus, _POLL_INTERVALO_MS);
}

function pararPolling() {
    if (intervaloPolling) { clearInterval(intervaloPolling); intervaloPolling = null; }
}

// Celular no bolso não precisa consultar nada. Ao voltar, consulta NA HORA em vez
// de esperar os 15s — senão o cliente abre o telefone e vê status velho, que é
// justamente quando ele mais quer a informação.
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pararPolling();
    } else if (pedidoAtual && view === 'status' && !_pollEncerrado) {
        iniciarPolling();
    }
});

async function consultarStatus() {
    if (!pedidoAtual || view !== 'status') { pararPolling(); return; }

    const agora = Date.now();
    if (agora - _ultimaConsulta < _POLL_MIN_ENTRE_CHAMADAS_MS) return;
    _ultimaConsulta = agora;

    try {
        const resultado = await apiGet('getStatusPedidoOnline', { comandaId: pedidoAtual.comandaId });
        if (resultado && !resultado.erro) {
            pedidoAtual.status = resultado.status;
            pedidoAtual.total = resultado.total;
            render();
            // 'pronto' já é a notícia que o cliente estava esperando — daí em diante
            // ele vem buscar, e continuar consultando só gera carga. A sessão expira
            // em 12h, então ele ainda vê o status se voltar no mesmo dia.
            if (resultado.status === 'pronto' || resultado.status === 'concluido') {
                _pollEncerrado = true;
                pararPolling();
            }
        }
    } catch (e) {
        // Falha de rede pontual no polling não deve travar a tela — só tenta de novo no próximo ciclo.
    }
}

function renderAjuda() {
    return `
        <div class="ajuda-bloco">
            <div class="ajuda-titulo">Precisa de ajuda ou tem alguma dúvida?</div>
            <div class="ajuda-acoes">
                <a class="ajuda-btn whatsapp" href="https://wa.me/${WHATSAPP_AJUDA}" target="_blank" rel="noopener">💬 WhatsApp</a>
                <a class="ajuda-btn telefone" href="tel:${TELEFONE_AJUDA}">📞 Ligar</a>
            </div>
        </div>
    `;
}

function renderFormulario() {
    const letrasTamanho = Object.keys(TAMANHOS);
    const max = state.tamanho ? TAMANHOS[state.tamanho].maxCarnes : null;

    if (letrasTamanho.length === 0) {
        return `
            <div class="card tela-centro">
                <div class="titulo-card">Sem marmitas disponíveis agora</div>
                <div class="dica">Volte mais tarde ou fale com a gente pelo WhatsApp.</div>
                ${renderAjuda()}
            </div>
        `;
    }

    const chipsTamanho = letrasTamanho.map(t => `
        <div class="chip ${state.tamanho === t ? 'selecionado' : ''}" onclick="selecionarTamanho('${t}')">${TAMANHOS[t].label} · R$ ${TAMANHOS[t].preco.toFixed(2)}</div>
    `).join('');

    const dicaTamanho = state.tamanho
        ? `<div class="dica">Tamanho ${state.tamanho}: ${max === 1 ? 'escolha 1 carne' : 'escolha até 2 carnes'}</div>`
        : `<div class="dica">Escolha o tamanho pra liberar as carnes</div>`;

    const chipsCarne = CARNES_DO_DIA.length > 0 ? CARNES_DO_DIA.map(c => {
        const selecionada = state.carnesSelecionadas.includes(c);
        const atingiuMax = state.tamanho && max > 1 && state.carnesSelecionadas.length >= max && !selecionada;
        return `<div class="chip ${selecionada ? 'selecionado' : ''} ${atingiuMax ? 'desabilitado' : ''}" onclick="toggleCarne('${c.replace(/'/g,"\\'")}')">${selecionada ? '✓ ' : ''}${escapeHtml(c)}</div>`;
    }).join('') : `<div class="dica">Sem carnes cadastradas para hoje — fale com a gente pelo WhatsApp.</div>`;

    const dicaCarne = state.tamanho && max > 1
        ? `<div class="dica ${state.carnesSelecionadas.length === max ? 'ok' : ''}">${state.carnesSelecionadas.length} de ${max} carnes selecionadas</div>`
        : '';

    // Chip marcado quando o texto correspondente já está em state.obs (comparação
    // case-insensitive, porque o cliente pode ter digitado à mão no campo livre).
    const _obsPartes = String(state.obs || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    const chipsObs = OBS_SUGESTOES.map(o => {
        const sel = _obsPartes.includes(o.toLowerCase());
        return `<div class="chip ${sel ? 'selecionado' : ''}" onclick="toggleObsSugestao('${o.replace(/'/g,"\\'")}')">${sel ? '✓ ' : ''}${escapeHtml(o)}</div>`;
    }).join('');

    // Acompanhamentos ficam FECHADOS por padrão: são 7 chips de exceção ocupando meia
    // tela num pedido onde a maioria não quer tirar nada. O que resolve a visibilidade
    // (o problema original: ninguém achava o campo) não é ter tudo aberto — é a PERGUNTA
    // estar em destaque e no lugar certo. Por isso o gatilho aqui é uma faixa larga,
    // com borda e seta, logo depois da Carne — e não o link apagado no rodapé de antes.
    // Abre automaticamente se já houver algo marcado (ex: cliente editando um item do
    // carrinho), e o resumo do que está marcado aparece na faixa mesmo fechada, pra
    // escolha nenhuma sumir de vista.
    const _obsMarcadas = OBS_SUGESTOES.filter(o => _obsPartes.includes(o.toLowerCase()));
    const _acompAberto = state.acompAberto || _obsMarcadas.length > 0;
    const _temSelecao = _obsMarcadas.length > 0;
    const blocoAcompanhamentos = `
        <div class="secao-expansivel ${_acompAberto ? 'aberta' : ''}" onclick="toggleAcompAberto()">
            <div>
                <div class="se-titulo">Quer tirar algum acompanhamento?</div>
                <div class="se-resumo ${_temSelecao ? 'tem-selecao' : ''}">${
                    _temSelecao ? escapeHtml(_obsMarcadas.join(', ')) : 'Opcional'
                }</div>
            </div>
            <div class="se-seta">▾</div>
        </div>
        ${_acompAberto ? `<div class="chips" style="margin-top:10px;">${chipsObs}</div>` : ''}
    `;

    const linhasMarmitas = state.carrinho.map((item, i) => {
        const emEdicao = state.editandoIndex === i;
        return `
        <div class="item-carrinho" style="${emEdicao ? 'background:var(--bg-light); border-radius:8px; padding:10px 8px;' : ''}">
            <div style="cursor:pointer;" onclick="editarItemCarrinho(${i})" title="Toque pra editar tamanho, carne ou observação">
                <div class="item-nome">Marmita ${item.tamanho} <span style="font-weight:normal; color:var(--gray); font-size:12px;">${emEdicao ? '✏️ editando...' : '✏️ editar'}</span></div>
                <div class="item-detalhe">${escapeHtml(item.carnes.join(' + '))}</div>
                ${item.obs ? `<div class="item-detalhe">↳ ${escapeHtml(item.obs)}</div>` : ''}
            </div>
            <div class="linha-item-dir">
                <div class="item-preco">R$ ${(item.qtd * item.precoUnit).toFixed(2)}</div>
                <div class="qtd-mini">
                    <div class="qtd-mini-btn" onclick="alterarQtdCarrinho(${i},-1)">−</div>
                    <div class="qtd-mini-val">${item.qtd}</div>
                    <div class="qtd-mini-btn" onclick="alterarQtdCarrinho(${i},1)">+</div>
                </div>
            </div>
        </div>
    `;
    }).join('');

    const linhasBebidas = state.bebidas.map(b => `
        <div class="item-carrinho">
            <div>
                <div class="item-nome">${escapeHtml(b.nome)}</div>
            </div>
            <div class="linha-item-dir">
                <div class="item-preco">R$ ${(b.qtd * b.preco).toFixed(2)}</div>
                <div class="qtd-mini">
                    <div class="qtd-mini-btn" onclick="alterarQtdBebida(${b.codigo},-1)">−</div>
                    <div class="qtd-mini-val">${b.qtd}</div>
                    <div class="qtd-mini-btn" onclick="alterarQtdBebida(${b.codigo},1)">+</div>
                </div>
            </div>
        </div>
    `).join('');

    const itensPedido = (state.carrinho.length === 0 && state.bebidas.length === 0)
        ? `<div class="vazio">Adicione marmitas ou bebidas ao seu pedido acima</div>`
        : linhasMarmitas + linhasBebidas;

    // O chip da bebida mostra a quantidade já adicionada e fica marcado.
    // Motivo: as opções ficam ABAIXO do resumo "Seu pedido", então a bebida adicionada
    // aparece numa lista ACIMA de onde o dedo está — o cliente tocava e não via
    // confirmação nenhuma sem rolar de volta pra cima. Com o estado no próprio chip, a
    // resposta acontece exatamente onde ele está olhando, sem precisar navegar.
    const listaBebidasDisponiveis = state.bebidaAberta
        ? (BEBIDAS_CARDAPIO.length > 0
            ? `<div class="chips" style="margin-top:10px;">${BEBIDAS_CARDAPIO.map(b => {
                const _noCarrinho = state.bebidas.find(x => x.codigo === b.codigo);
                const _qtd = _noCarrinho ? _noCarrinho.qtd : 0;
                return `<div class="chip ${_qtd > 0 ? 'selecionado' : ''}" onclick="adicionarBebida(${b.codigo}, '${b.nome.replace(/'/g,"\\'")}', ${b.preco})">${_qtd > 0 ? `✓ ${_qtd}× ` : ''}${escapeHtml(b.nome)} · R$ ${b.preco.toFixed(2)}</div>`;
              }).join('')}</div>
              <div class="dica">Toque de novo para adicionar mais uma.</div>`
            : `<div class="dica" style="margin-top:10px;">Sem bebidas disponíveis agora</div>`)
        : '';

    const total = calcularTotal();

    const emEdicao = state.editandoIndex !== null;

    return `
        <div class="card" id="cardConfigurador">
            <div class="titulo-card">${emEdicao ? '✏️ Editando marmita' : 'Peça sua marmita'}</div>
            <div class="dica" style="margin-bottom:12px;">Acompanha arroz, feijão, macarrão, farofa, legumes, uma fritura e salada do buffet — você escolhe só o tamanho e a carne.</div>

            <div class="label-secao">Tamanho</div>
            <div class="chips">${chipsTamanho}</div>
            ${dicaTamanho}

            <div class="label-secao">Carne</div>
            <div class="chips">${chipsCarne}</div>
            ${dicaCarne}

            <!-- Remoção de acompanhamentos — posicionado aqui de propósito, logo após a
                 Carne: é parte de "o que vem na marmita", junto com tamanho e carne.
                 Antes só existia como campo de texto no rodapé, depois da quantidade e
                 escondido atrás de um link — invisível na prática. O rótulo é uma PERGUNTA
                 ("Quer tirar...?") e não um nome de campo ("Observação"): pergunta pede
                 resposta, rótulo de campo é ignorado. -->
            ${blocoAcompanhamentos}

            <!-- Renomeado (pesquisa de teste apontou "Quantidade" como confuso — lia como
                 "quantidade de carne" por ficar logo abaixo dos chips de carne). Dica reduzida
                 a uma frase curta a pedido do usuário — texto longo demais era em si um
                 sintoma de que o controle precisava de um nome melhor, não de mais explicação. -->
            <div class="label-secao" style="margin-top:22px;">Quantas marmitas iguais a essa?</div>
            <div class="qtd-control">
                <div class="qtd-btn" onclick="alterarQtd(-1)">−</div>
                <div class="qtd-valor">${state.qtd}</div>
                <div class="qtd-btn" onclick="alterarQtd(1)">+</div>
            </div>
            <div class="dica">Pra outro tamanho ou carne, adicione separado.</div>

            <!-- Campo livre mantido, mas continua discreto e fechado por padrão: os chips
                 acima cobrem o caso comum (remover acompanhamento) de forma padronizada.
                 O texto do link mudou de "Alguma observação sobre o pedido?" (genérico,
                 convidava a pedir qualquer coisa) para deixar claro que é complemento do
                 que já foi marcado, não um canal aberto de customização. O campo edita o
                 MESMO state.obs dos chips — por isso mostra o que já está marcado. -->
            ${state.obsAberta
                ? `<div class="label-secao" style="margin-top:14px;">Outra observação</div>
                   <input type="text" placeholder="Ex: Sem cebola" value="${escapeHtml(state.obs)}" oninput="state.obs = this.value">`
                : `<div class="link-discreto" style="margin-top:12px; text-align:left;" onclick="toggleObsAberta()">+ Outra observação</div>`
            }

            <div style="margin-top:16px; display:flex; gap:8px;">
                <button class="btn btn-primario" onclick="adicionarAoPedido()">${emEdicao ? '✓ Salvar alterações' : '+ Adicionar ao pedido'}</button>
            </div>
            ${emEdicao ? `<div class="link-discreto" onclick="cancelarEdicaoItem()">✕ Cancelar edição</div>` : ''}
        </div>

        <div class="card" id="cardPedido">
            <div class="titulo-card">Seu pedido</div>
            ${itensPedido}

            <div class="linha-total">
                <span>Total</span>
                <span class="valor">R$ ${total.toFixed(2)}</span>
            </div>

            <div class="acoes-pedido">
                <button class="btn btn-fantasma" onclick="irParaConfigurador()">${state.carrinho.length > 0 ? '+ Adicionar outra marmita' : '+ Adicionar marmita'}</button>
                <button class="btn btn-secundario" onclick="toggleBebidaAberta()">${state.bebidaAberta ? '− Fechar opções de bebida' : '+ Adicionar bebida'}</button>
            </div>
            ${listaBebidasDisponiveis}
        </div>

        <div class="card">
            <div class="titulo-card">Finalizar pedido</div>
            <div class="nota-retirada">🏠 Retire e pague no caixa do restaurante</div>

            <div class="campo">
                <label>Seu nome</label>
                <input type="text" placeholder="Como podemos te chamar" value="${escapeHtml(state.nome)}" oninput="state.nome = this.value">
            </div>
            <div class="campo">
                <label>WhatsApp</label>
                <input type="tel" id="campoWhatsapp" placeholder="(00) 00000-0000" value="${escapeHtml(state.whatsapp)}" oninput="aoDigitarWhatsapp(this.value)">
            </div>

            <button class="btn btn-primario" ${state.enviando ? 'disabled' : ''} onclick="confirmarPedido()">${state.enviando ? 'Enviando...' : 'Confirmar pedido · R$ ' + total.toFixed(2)}</button>
        </div>
    `;
}

function renderStatus() {
    const pedido = pedidoAtual;
    if (!pedido) { view = 'form'; return renderFormulario(); }

    // 3 etapas (igual ao protótipo testado). O GAS deriva isso olhando os itens da
    // comanda: 'aguardando' = preparo ainda não iniciado, 'em_preparo' = operador já
    // clicou INICIAR em algum item, 'pronto'/'concluido' = todos os itens concluídos/pago.
    const statusServidor = pedido.status || 'aguardando';
    const etapas = ['aguardando', 'em_preparo', 'pronto'];
    const labels = { 'aguardando': 'Aguardando', 'em_preparo': 'Em preparo', 'pronto': 'Pronto' };
    const idxPorStatus = { 'aguardando': 0, 'em_preparo': 1, 'pronto': 2, 'concluido': 2 };
    const idxAtual = idxPorStatus[statusServidor] ?? 0;

    const icones = ['⏳', '🔥', '✓'];
    const bolinhas = etapas.map((e, i) => {
        let classe = 'futura';
        let icone = '○';
        if (i < idxAtual) { classe = 'feita'; icone = '✓'; }
        else if (i === idxAtual) { classe = 'atual'; icone = icones[i]; }
        return `
            ${i > 0 ? `<div class="linha-progresso ${i <= idxAtual ? 'feita' : 'futura'}"></div>` : ''}
            <div class="etapa">
                <div class="bola ${classe}">${icone}</div>
                <div class="etapa-label ${i === idxAtual ? 'atual' : ''}">${labels[e]}</div>
            </div>
        `;
    }).join('');

    const mensagens = {
        'aguardando': ['Recebemos seu pedido!', 'Vamos começar o preparo em breve'],
        'em_preparo': ['Sua marmita está sendo preparada', 'Pode vir buscar em poucos minutos'],
        'pronto': ['Sua marmita está pronta!', 'Pode vir buscar e pagar no caixa'],
        'concluido': ['Pedido finalizado', 'Obrigado pela visita!']
    };
    const msg = mensagens[statusServidor] || mensagens['aguardando'];

    return `
        <div class="card tela-centro">
            <div class="dica">Pedido #${pedido.numero} — ${escapeHtml(pedido.nome)}</div>
            <div class="progresso">${bolinhas}</div>
            <div class="mensagem-status">${msg[0]}</div>
            <div class="submensagem-status">${msg[1]}</div>

            <button class="btn btn-secundario" style="margin-top:18px;" onclick="novoPedidoEmNovaAba()">+ Fazer novo pedido</button>

            ${renderAjuda()}
        </div>
    `;
}
