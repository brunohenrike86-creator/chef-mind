function render() {
    const app = document.getElementById('app');
    if (state.enviando) { app.innerHTML = renderEnviando(); return; }
    if (view === 'carregando') app.innerHTML = '<div class="loading-spinner">' +
        (_tentandoDeNovo ? 'Demorando um pouco mais que o normal — tentando de novo...'
                         : 'Carregando opções do dia...') + '</div>';
    else if (view === 'confirmacao') app.innerHTML = renderConfirmacao();
    else if (view === 'status') app.innerHTML = renderStatus();
    else if (view === 'fechado') app.innerHTML = renderFechado();
    else if (view === 'erro_carregamento') app.innerHTML = renderErroCarregamento();
    else if (view === 'envio_incerto') app.innerHTML = renderEnvioIncerto();
    else app.innerHTML = renderFormulario();

    if (state.rolarParaPedidoAoRenderizar) {
        state.rolarParaPedidoAoRenderizar = false;
        const el = document.getElementById('cardPedido');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (state.rolarParaConfiguradorAoRenderizar) {
        state.rolarParaConfiguradorAoRenderizar = false;
        const el = document.getElementById('cardConfigurador');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

// Extrai a letra do tamanho a partir do nome do cardápio ("Marmita G" -> "G").
// Frágil se a convenção de nomenclatura mudar, mas é o único dado disponível hoje —
// não há campo de tamanho separado no modelo de dados do cardápio.
function _letraTamanho(nomeMarmita) {
    const partes = String(nomeMarmita).trim().split(/\s+/);
    return partes[partes.length - 1].toUpperCase();
}

// ===== Carregamento das opções do dia (ponto 10b do plano emergencial) =====
//
// ⚠️ O bug que isto corrige: o catch antigo zerava TAMANHOS/CARNES/BEBIDAS e caía
// na mesma tela de "Sem marmitas disponíveis agora — Volte mais tarde". Ou seja,
// uma falha NOSSA (servidor não respondeu em 20s) era apresentada ao cliente como
// "o restaurante não tem comida hoje". O cliente ia almoçar em outro lugar e o
// restaurante nunca ficava sabendo. Falha de carregamento e cardápio vazio são
// coisas diferentes e precisam de telas diferentes.

let _falhaCarregamento = false;   // true = não conseguimos carregar (≠ carregou vazio)
let _tentandoDeNovo    = false;   // alimenta a mensagem do spinner na 2ª tentativa

// Duas tentativas de 12s em vez de uma de 20s: o orçamento total de espera do
// cliente fica parecido (~25s), mas ele ganha DUAS chances. A maioria das falhas
// é pico transitório de fila — na segunda tentativa, 1,2s depois, costuma passar.
const _CARREGAMENTO_TENTATIVAS = 2;
const _CARREGAMENTO_TIMEOUT_MS = 12000;

function _registrarFalhaCarregamento() {
    // Contador local para o Painel de Saúde (ponto 8): hoje não temos NENHUMA
    // medida de quantos clientes bateram na porta e não conseguiram entrar.
    try {
        const reg = JSON.parse(localStorage.getItem('cm_pedido_falhas') || '{"total":0}');
        reg.total = (reg.total || 0) + 1;
        reg.ultima = new Date().toISOString();
        localStorage.setItem('cm_pedido_falhas', JSON.stringify(reg));
    } catch (e) { /* localStorage cheio ou bloqueado nunca pode quebrar a tela */ }
}

// ═══════════════════════════════════════════════════════════════════════════
// ABERTURA SEM APPS SCRIPT (ponto 13, decidido em 29/08)
//
// Por que existe: medimos o `getOpcoesPedidoOnline` e ele responde em 50ms
// tocando ZERO vezes na planilha (`_ms:50, _chs:0`). Ou seja, o que o cliente
// esperava não era consulta — era **transporte**: o piso de container do Apps
// Script mais os dois saltos HTTP, e a cauda de 10-30s quando ela aparece.
//
// Não dá para consertar a cauda. Dá para não jogar a ficha: o que o cliente vê
// na abertura agora não passa pelo Apps Script.
//
// A divisão segue a natureza de cada dado, não a conveniência:
//
//   No CÓDIGO  → código, nome, estrutura (letra do tamanho, máximo de carnes).
//                Só muda por decisão de negócio, que já exige deploy de qualquer forma.
//   No CSV     → preço e carnes do dia. Mudam sem aviso, e preço errado na tela
//                é dinheiro com o cliente na frente (o servidor recalcula — Regra 18).
//
// Hardcodar preço junto teria criado exatamente esse risco de forma permanente:
// mudar o preço na planilha e esquecer o deploy = cliente vê R$ 21 e paga R$ 24,
// por tempo indeterminado e sem nada avisar.
// ═══════════════════════════════════════════════════════════════════════════

const CARDAPIO_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4wMkpjmQ0RHUX1jVHnIcWLOnOslvqLSF90Fj59ebOuj-XwPNSlgFQwJfjF5-HFXrYy25hXKPbrMgJ/pub?gid=1543316840&single=true&output=csv';
const CHAVE_CARDAPIO_CACHE = 'chefmind-pedido-cardapio';
const _CSV_TIMEOUT_MS = 6000;   // é infra estática; se demora mais que isso, algo está errado — cai logo

// Estrutura fixa. O preço NÃO está aqui de propósito (ver bloco acima).
// A letra do tamanho é declarada em vez de deduzida do nome: o código antigo
// fazia `_letraTamanho("Marmitex P")`, e renomear o item na planilha para
// "Marmita Pequena" quebraria o tamanho silenciosamente.
const CARDAPIO_FIXO = {
    marmitas: [
        { codigo: 5, letra: 'P', nome: 'Marmitex P' },
        { codigo: 6, letra: 'M', nome: 'Marmitex M' },
        { codigo: 7, letra: 'G', nome: 'Marmitex G' }
    ],
    bebidas: [
        { codigo: 18, nome: 'Coca Cola Original 350ml Lata' },
        { codigo: 19, nome: 'Coca Cola Zero 350ml Lata' },
        { codigo: 22, nome: 'Coca Cola Original 1L' },
        { codigo: 23, nome: 'Coca Cola Zero 1L' },
        { codigo: 36, nome: 'Fanta Laranja 350ml Lata' },
        { codigo: 41, nome: 'Sprite 350ml Lata' },
        { codigo: 43, nome: 'Guaraná Antarctica 350ml Lata' },
        { codigo: 44, nome: 'Guaraná Antarctica Zero 350ml Lata' }
    ]
};

function _siglaDiaHoje() {
    return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'][new Date().getDay()];
}

// Parser de CSV de verdade, com aspas. Um `split(',')` ingênuo quebraria já no
// primeiro dia: a lista de carnes É separada por vírgula, então o Google entrega
// esse campo entre aspas — e o split partiria "Frango Assado, Feijoada" em duas colunas.
function _parseCSV(texto) {
    const linhas = [];
    let campo = '', linha = [], aspas = false;
    for (let i = 0; i < texto.length; i++) {
        const c = texto[i];
        if (aspas) {
            if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; }
            else campo += c;
        } else if (c === '"') { aspas = true; }
        else if (c === ',') { linha.push(campo); campo = ''; }
        else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
        else if (c !== '\r') { campo += c; }
    }
    if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
    return linhas;
}

// Planilha em português escreve decimal com vírgula ("21,5"). Um `parseFloat`
// direto devolveria 21 e o cliente veria meio real a menos — silenciosamente.
function _numeroPlanilha(v) {
    if (v === null || v === undefined) return NaN;
    let t = String(v).trim().replace(/[R$\s]/g, '');
    if (!t) return NaN;
    // Qual separador é o decimal? O ÚLTIMO. "1.234,56" e "1,234.56" são o mesmo
    // valor escrito em duas convenções, e olhar só para a vírgula transformava o
    // primeiro em 1,23456 — erro de mil vezes, silencioso, em cima de preço.
    const iVirgula = t.lastIndexOf(','), iPonto = t.lastIndexOf('.');
    if (iVirgula > iPonto)      t = t.replace(/\./g, '').replace(',', '.');   // 1.234,56
    else if (iPonto > iVirgula) t = t.replace(/,/g, '');                      // 1,234.56
    else                        t = t.replace(',', '.');                      // só um dos dois
    return parseFloat(t);
}

// "Indisponível" só quando dito explicitamente. Linha `disp_` ausente = disponível,
// que é o mesmo padrão do GAS hoje (`disponivel_online` vazio conta como true).
// Assim o bloco opcional na planilha pode ser colado depois, sem tocar no código.
function _estaDisponivel(v) {
    if (v === undefined || v === null || String(v).trim() === '') return true;
    const t = String(v).trim().toLowerCase();
    return !(t === 'false' || t === 'falso' || t === 'nao' || t === 'não' || t === '0' || t === 'n');
}

async function _buscarCardapioCSV() {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), _CSV_TIMEOUT_MS);
    let texto;
    try {
        const r = await fetch(CARDAPIO_CSV_URL + '&_t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        texto = await r.text();
    } catch (e) {
        console.warn('[Cardápio] CSV indisponível (' + e.message + ') — caindo no Apps Script');
        return null;
    } finally { clearTimeout(t); }

    const mapa = {};
    _parseCSV(texto).forEach(l => { if (l.length >= 2 && l[0]) mapa[String(l[0]).trim()] = l[1]; });

    const precos = {}, disp = {};
    [].concat(CARDAPIO_FIXO.marmitas, CARDAPIO_FIXO.bebidas).forEach(i => {
        precos[i.codigo] = _numeroPlanilha(mapa['preco_' + i.codigo]);
        disp[i.codigo]   = _estaDisponivel(mapa['disp_' + i.codigo]);
    });

    // Validação: se as três marmitas não vieram com preço válido, o CSV está
    // quebrado (fórmula com #N/A, aba renomeada, coluna movida). Melhor cair no
    // Apps Script — lento e certo — do que exibir cardápio errado. Isto cobre
    // sozinho a maior parte das quebras; a chave `modo` cobre o resto.
    const marmitasOk = CARDAPIO_FIXO.marmitas.every(m => precos[m.codigo] > 0);
    if (!marmitasOk) {
        console.warn('[Cardápio] CSV sem preço válido das marmitas — caindo no Apps Script', precos);
        return null;
    }

    const carnesPorDia = {};
    ['seg','ter','qua','qui','sex','sab','dom'].forEach(d => {
        carnesPorDia[d] = String(mapa['carnes_' + d] || '').split(',').map(c => c.trim()).filter(Boolean);
    });

    return { modo: String(mapa['modo'] || 'estatico').trim().toLowerCase(),
             precos: precos, disp: disp, carnes: carnesPorDia };
}

function _aplicarCardapio(d) {
    TAMANHOS = {};
    CARDAPIO_FIXO.marmitas.forEach(m => {
        if (!d.disp[m.codigo] || !(d.precos[m.codigo] > 0)) return;
        TAMANHOS[m.letra] = { label: m.letra, preco: d.precos[m.codigo],
                              codigo: m.codigo, maxCarnes: MAX_CARNES_POR_LETRA[m.letra] || 2 };
    });
    BEBIDAS_CARDAPIO = CARDAPIO_FIXO.bebidas
        .filter(b => d.disp[b.codigo] && d.precos[b.codigo] > 0)
        .map(b => ({ codigo: b.codigo, nome: b.nome, preco: d.precos[b.codigo] }));
    CARNES_DO_DIA = d.carnes[_siglaDiaHoje()] || [];
    _falhaCarregamento = false;
    _tentandoDeNovo = false;
}

// Cache só do DIA. Carne de ontem descreve o almoço de ontem — mostrá-la como
// se fosse de hoje é pior do que qualquer espera. E preço de "algumas horas
// atrás" é um risco muito menor do que preço de semanas atrás.
function _gravarCardapioCache(d) {
    try {
        localStorage.setItem(CHAVE_CARDAPIO_CACHE,
            JSON.stringify({ dia: new Date().toISOString().slice(0, 10), dados: d }));
    } catch (e) { console.warn('[Cardápio] não consegui guardar o cache:', e.message); }
}

function _lerCardapioCacheDeHoje() {
    let v = null;
    try { v = JSON.parse(localStorage.getItem(CHAVE_CARDAPIO_CACHE) || 'null'); } catch (e) { return null; }
    if (!v || !v.dados) return null;
    if (v.dia !== new Date().toISOString().slice(0, 10)) {
        console.log('[Cardápio] cache é de ' + v.dia + ' — descartado');
        return null;
    }
    return v.dados;
}

async function _revalidarCardapioEmSegundoPlano() {
    const d = await _buscarCardapioCSV();
    if (!d || d.modo === 'gas') return;
    const antes = JSON.stringify({ t: TAMANHOS, b: BEBIDAS_CARDAPIO, c: CARNES_DO_DIA });
    _aplicarCardapio(d);
    _gravarCardapioCache(d);
    const depois = JSON.stringify({ t: TAMANHOS, b: BEBIDAS_CARDAPIO, c: CARNES_DO_DIA });
    if (antes !== depois) {
        console.log('[Cardápio] mudou desde o cache — atualizando a tela');
        // Só re-renderiza o que o cliente ainda pode escolher. Nas telas de
        // acompanhamento e confirmação o pedido já foi feito: trocar o cardápio
        // debaixo dele não corrige nada e assusta.
        if (view === 'form' || view === 'carregando') render();
    }
}

async function carregarOpcoes() {
    // 1. Cache de hoje: pinta na hora e revalida por trás. O cliente não espera.
    const cache = _lerCardapioCacheDeHoje();
    if (cache) {
        _aplicarCardapio(cache);
        console.log('[Cardápio] servido do cache de hoje (instantâneo)');
        _revalidarCardapioEmSegundoPlano();
        return true;
    }

    // 2. Sem cache: busca o CSV (~250ms, infra estática, sem container e sem cauda).
    const d = await _buscarCardapioCSV();
    if (d && d.modo === 'gas') {
        console.warn('[Cardápio] chave `modo` = gas na planilha — usando o Apps Script por decisão manual');
        return await _carregarOpcoesViaGAS();
    }
    if (d) {
        _aplicarCardapio(d);
        _gravarCardapioCache(d);
        console.log('[Cardápio] servido do CSV publicado');
        return true;
    }

    // 3. CSV fora do ar ou inválido: o caminho antigo continua inteiro aqui.
    return await _carregarOpcoesViaGAS();
}

async function _carregarOpcoesViaGAS() {
    for (let tentativa = 1; tentativa <= _CARREGAMENTO_TENTATIVAS; tentativa++) {
        try {
            const opcoes = await apiGet('getOpcoesPedidoOnline', null, _CARREGAMENTO_TIMEOUT_MS);
            if (!opcoes || opcoes.erro) throw new Error((opcoes && opcoes.erro) || 'Resposta inválida');

            TAMANHOS = {};
            (opcoes.marmitas || []).forEach(m => {
                const letra = _letraTamanho(m.nome);
                TAMANHOS[letra] = {
                    label: letra,
                    preco: m.preco,
                    codigo: m.codigo,
                    maxCarnes: MAX_CARNES_POR_LETRA[letra] || 2
                };
            });
            CARNES_DO_DIA = opcoes.carnes || [];
            // Bebida sem preço cadastrado não pode quebrar o cálculo do total — oculta da lista online.
            BEBIDAS_CARDAPIO = (opcoes.bebidas || []).filter(b => b.preco > 0);

            _falhaCarregamento = false;
            _tentandoDeNovo    = false;
            return true;
        } catch (e) {
            console.warn('[Pedido Online] Falha ao carregar opções (tentativa ' +
                         tentativa + '/' + _CARREGAMENTO_TENTATIVAS + '):', e.message);
            if (tentativa < _CARREGAMENTO_TENTATIVAS) {
                _tentandoDeNovo = true;
                if (view === 'carregando') render();   // avisa o cliente que ainda estamos tentando
                await new Promise(r => setTimeout(r, 1200));
            }
        }
    }

    TAMANHOS = {}; CARNES_DO_DIA = []; BEBIDAS_CARDAPIO = [];
    _falhaCarregamento = true;
    _tentandoDeNovo    = false;
    _registrarFalhaCarregamento();
    return false;
}

// Botão "Tentar de novo" da tela de erro. Global porque o HTML é montado por string.
async function tentarCarregarNovamente() {
    view = 'carregando';
    render();
    const ok = await carregarOpcoes();
    view = ok ? (estaDentroDoHorario() ? 'form' : 'fechado') : 'erro_carregamento';
    render();
}

// Tela de envio sem confirmação (Item B). O objetivo dela é UM só: impedir o reenvio.
//
// Por isso não tem botão "tentar de novo" — seria a porta exata que queremos fechar. E a
// mensagem assume a incerteza em vez de fingir sucesso ou fingir falha: o cliente merece
// saber que o pedido provavelmente entrou, e tem um caminho humano (WhatsApp/telefone,
// via renderAjuda) para tirar a dúvida em segundos.
// Tela de envio sem confirmação — reescrita na Onda 1.
//
// Antes ela era um beco: avisava para não reenviar e mandava o cliente pro WhatsApp. Era o
// melhor possível sem deduplicação, porque reenviar significava duplicar de verdade.
//
// Com a `cliente_key` isso mudou de natureza. Perguntar ao servidor "meu pedido entrou?"
// virou uma operação segura — se entrou, ele devolve o mesmo pedido; se não, cria uma vez
// só. Então a tela deixa de pedir paciência e passa a resolver: um toque e o cliente
// descobre onde está. O WhatsApp continua ali, mas como plano B, não como único caminho.
function renderEnvioIncerto() {
    return `
        <div class="card tela-centro">
            <div class="titulo-card">Vamos confirmar seu pedido</div>
            <div class="dica" style="margin-top:14px;">
                A resposta do nosso servidor demorou mais que o esperado — mas o seu pedido
                <strong>provavelmente já foi registrado</strong>.
            </div>
            <div class="dica" style="margin-top:12px;">
                Toque no botão abaixo que a gente verifica. Pode tocar quantas vezes quiser:
                <strong>isso não cria um segundo pedido</strong>.
            </div>
            <button class="btn btn-primario" style="margin-top:18px;"
                    id="btnVerificarPedido" onclick="verificarPedidoIncerto()">
                Verificar meu pedido
            </button>
            ${renderAjuda()}
        </div>
    `;
}

// Reenvia o MESMO payload, com a mesma chave e `retentativa: true`. O servidor deduplica:
// devolve o pedido existente se ele já entrou, ou cria uma vez só se não entrou. Nos dois
// casos o cliente termina na tela de acompanhamento — que é onde ele queria estar.
// Reenvia o payload com `retentativa: true` e devolve a resposta. O servidor deduplica pela
// `cliente_key`: entrega o pedido existente se ele já entrou, ou cria uma vez só se não
// entrou. Nos dois casos o cliente termina no acompanhamento — que é onde ele queria estar.
//
// ⚠️ DUAS TENTATIVAS, não uma. Em 27/08 o Bruno precisou clicar duas vezes: a 1ª verificação
// levou ~17s (dentro do prazo) e mesmo assim falhou, porque o `echo` do GAS devolveu OUTRO
// redirect em vez do JSON. A 2ª foi em 2,24s. Como reenviar é comprovadamente seguro, pedir
// ao cliente que clique de novo é transferir a ele um problema que o código pode resolver.
async function _tentarRecuperarPedido(payload, tentativas) {
    tentativas = tentativas || 2;
    let r = null;
    for (let i = 0; i < tentativas; i++) {
        r = await apiPost('novoPedidoOnline', Object.assign({}, payload, { retentativa: true }));
        // Sem este log não há como saber, olhando de fora, se o servidor CRIOU um pedido novo
        // ou RECONHECEU o que já existia. `_dedup: true` prova que o reenvio não duplicou.
        console.log('[Pedido] recuperação tentativa ' + (i + 1) + ' →', r,
                    r && r._dedup ? '| ✅ DEDUP (não criou outro)' : '| criado agora');
        if (r && !r.erro && r.comandaId) return r;
        if (i < tentativas - 1) await new Promise(res => setTimeout(res, 1200));
    }
    return r;
}

// Conclui a recuperação: guarda a sessão e leva o cliente ao acompanhamento.
// Tira o `?novo=1` da URL depois que o pedido entrou. Sem isto, um F5 seguinte continuaria
// ignorando a sessão salva e devolveria o cliente ao formulário — com o pedido já na cozinha.
function _limparMarcaNovoNaURL() {
    try {
        const u = new URL(location.href);
        if (u.searchParams.has('novo')) {
            u.searchParams.delete('novo');
            history.replaceState(null, '', u.toString());
        }
    } catch (e) {}
}

function _assumirPedidoRecuperado(r, origem) {
    // Mesma ordem do `confirmarPedido`, pelo mesmo motivo: a nova âncora antes de soltar a
    // antiga. Aqui a janela é ainda mais fácil de atingir — a recuperação roda no boot, e o
    // cliente impaciente pode recarregar de novo no meio dela.
    if (state.nome && state.nome.trim()) salvarClienteLembrado(state.nome.trim(), state.whatsapp.trim());
    pedidoAtual = {
        comandaId: r.comandaId, numero: r.numero,
        nome: (state.nome && state.nome.trim()) || (r.nomeCliente || ''),
        itens: state.carrinho, bebidas: state.bebidas, total: calcularTotal()
    };
    salvarSessaoAtiva(pedidoAtual);   // 1º

    _limparPedidoEmVoo();             // 2º
    _limparMarcaNovoNaURL();
    _limparClienteKey();
    console.log('[Pedido] recuperado via ' + origem + ' → comanda ' + r.numero);
    view = 'status';
    render();
    iniciarPolling();
}

async function verificarPedidoIncerto() {
    const payload = _payloadIncerto || _lerPedidoEmVoo();
    if (!payload) { erro('Recarregue a página e faça o pedido novamente.'); return; }
    const btn = document.getElementById('btnVerificarPedido');
    if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }

    const r = await _tentarRecuperarPedido(payload);

    if (btn) { btn.disabled = false; btn.textContent = 'Verificar meu pedido'; }

    if (!r || r.erro || !r.comandaId) {
        erro('Ainda não conseguimos confirmar. Tente de novo em alguns segundos.');
        return;
    }
    _assumirPedidoRecuperado(r, 'botão');
}

function renderErroCarregamento() {
    return `
        <div class="card tela-centro">
            <div class="titulo-card">Não conseguimos carregar o cardápio</div>
            <div class="dica">O problema é do nosso lado, não do seu pedido. Normalmente resolve na segunda tentativa.</div>
            <button class="btn btn-primario" style="margin-top:18px;" onclick="tentarCarregarNovamente()">Tentar de novo</button>
            ${renderAjuda()}
        </div>
    `;
}

async function inicializar() {
    // ?novo=1 = aba aberta via "Fazer novo pedido" (ver novoPedidoEmNovaAba) — ignora a
    // sessão ativa de propósito, pra essa aba abrir no formulário mesmo com um pedido em
    // andamento salvo no localStorage (a aba original continua acompanhando esse pedido).
    const pularSessao = new URLSearchParams(location.search).get('novo') === '1';
    const sessaoAtiva = pularSessao ? null : lerSessaoAtiva();

    // ⚠️ NÃO carregar o cardápio quando ele não vai ser usado.
    //
    // Antes, inicializar() chamava carregarOpcoes() como primeira linha, sempre. Um
    // cliente que abrisse o link fora do horário esperava as DUAS tentativas de 12s
    // (24s de espera) para ver a tela "Fora do horário" — que não usa marmita, carne
    // nem bebida. renderStatus() também não usa nada disso.
    //
    // Não é só desperdício de espera: cada chamada ao GAS é uma aposta na cauda de
    // 10-30s do transporte (ver plano emergencial). Chamada que não precisa existir é
    // ficha jogada fora na loteria — e, no horário de pico, ficha tirada de quem
    // realmente precisa.
    // A marca de "pedido em voo" é lida AQUI, antes de qualquer rede. Ela mora no
    // localStorage: custa microssegundos e não pode falhar. Estava sendo lida DEPOIS do
    // `carregarOpcoes()` — ou seja, atrás de até 24s de espera (duas tentativas de 12s),
    // exatamente no cenário em que o cliente acabou de recarregar e está ansioso.
    //
    // O princípio: decisão que depende só de dado LOCAL nunca fica atrás de decisão que
    // depende da REDE. Uma não pode falhar; a outra falha o tempo todo.
    const _emVoo = _lerPedidoEmVoo();

    // Mostra as três entradas que decidem a tela. Se o cliente cair no cardápio quando não
    // devia, esta linha diz qual das três estava errada — em vez de deixar a dedução por
    // conta de quem está testando.
    // Lista as chaves presentes. Se a marca sumiu mas as outras estão lá, alguém a removeu.
    // Se sumiram todas, o armazenamento foi limpo. São investigações opostas.
    try {
        console.log('[Boot] chaves no localStorage:', Object.keys(localStorage).join(' · ') || '(nenhuma)');
    } catch (e) { console.warn('[Boot] não consegui listar o localStorage:', e.message); }

    console.log('%c[Boot] decisão:', 'font-weight:bold',
                '| ?novo=' + pularSessao,
                '| sessão=' + (sessaoAtiva ? ('#' + sessaoAtiva.numero) : 'não'),
                '| em voo=' + (_emVoo ? 'SIM' : 'não'),
                '| horário=' + estaDentroDoHorario(),
                '| versão=' + CHEF_MIND_PEDIDO_VERSAO);

    // Nem o acompanhamento nem a tela de recuperação usam marmita, carne ou bebida. Somar
    // `!_emVoo` aqui é a mesma economia que já se fazia para a sessão e para o fora-do-horário.
    const precisaDoCardapio = !sessaoAtiva && !_emVoo && estaDentroDoHorario();
    if (precisaDoCardapio) await carregarOpcoes();

    if (sessaoAtiva && sessaoAtiva.comandaId) {
        pedidoAtual = sessaoAtiva;
        view = 'status';
        render();
        iniciarPolling();
        return;
    }

    // ═══ PEDIDO EM VOO: recuperar antes de mostrar o cardápio (ponto 25-C) ═══
    //
    // Chegou aqui sem sessão ativa, mas com a marca de "enviei e não sei o desfecho". Sem
    // isto, o cliente veria o cardápio limpo e faria o pedido de novo — enquanto o primeiro
    // já está na cozinha.
    //
    // O reenvio é seguro: o servidor deduplica pela `cliente_key`. E note que a marca é lida
    // ANTES de qualquer decisão de tela — se o cardápio aparecesse primeiro, já teríamos
    // perdido o cliente para o segundo pedido.
    // ⚠️ O `pularSessao` NÃO se aplica aqui, e confundir os dois foi um erro meu que o
    // teste 2 do Bruno pegou (28/08).
    //
    // `?novo=1` significa "esta aba é para um pedido NOVO, ignore o pedido em andamento da
    // OUTRA aba". Faz sentido para a sessão salva. Não faz nenhum para o pedido em voo: ele
    // foi enviado DESTA aba, depois que ela abriu. É dela.
    //
    // E o parâmetro sobrevive ao F5 — então o guard desligava a recuperação exatamente no
    // cenário que ela existe para cobrir: cliente que veio pelo "Fazer novo pedido", enviou,
    // e recarregou durante a espera.
    if (_emVoo) {
        console.warn('[Pedido] havia um pedido em voo — recuperando antes de abrir o cardápio');
        view = 'envio_incerto';
        _payloadIncerto = _emVoo;
        // Repõe o carrinho para o resumo do acompanhamento não ficar vazio.
        state.nome = _emVoo.nomeCliente || state.nome;
        state.whatsapp = _emVoo.whatsapp || state.whatsapp;
        render();

        const r = await _tentarRecuperarPedido(_emVoo);
        if (r && !r.erro && r.comandaId) { _assumirPedidoRecuperado(r, 'abertura da página'); return; }

        // Não deu: a tela de verificação já está na frente do cliente, com o botão. Melhor
        // isso do que o cardápio limpo — pelo menos ele sabe que existe um pedido.
        console.warn('[Pedido] recuperação automática falhou; cliente fica na tela de verificação');
        return;
    }

    const clienteSalvo = lerClienteSalvo();
    state.nome = clienteSalvo.nome || '';
    state.whatsapp = clienteSalvo.whatsapp || '';

    // Ordem de prioridade das telas, e o porquê de cada uma:
    // 1. Fora do horário vence a falha de carregamento — "estamos fechados" é uma
    //    informação mais útil e mais verdadeira do que "não carregou".
    // 2. Falha de carregamento vira tela de erro com retry — NUNCA a tela de
    //    "sem marmitas", que manda o cliente embora por um problema NOSSO.
    // 3. Carregou de verdade e não tem marmita → aí sim "Sem marmitas disponíveis".
    if (!estaDentroDoHorario())  view = 'fechado';
    else if (_falhaCarregamento) view = 'erro_carregamento';
    else                         view = 'form';
    render();
}

inicializar();
</script>
</body>
</html>
